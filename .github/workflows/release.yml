name: Release

# Versioning and publishing via Changesets:
# - On push to main with pending changesets (files in .changeset/), opens or
#   updates a "Version Packages" PR that bumps package.json and rewrites
#   CHANGELOG.md.
# - Merging that PR re-triggers this workflow; with no pending changesets
#   left, it publishes the new version to npm instead (prepublishOnly runs
#   typecheck/test/build first) and tags the release.
#
# Publishes with npm trusted publishing (OIDC): npmjs.com trusts this workflow
# file, so there is no npm token to store, rotate or expire. Configured under
# the package's Settings -> Trusted Publisher on npmjs.com.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # No registry-url: it writes an .npmrc that expects a token, which would
      # take precedence over OIDC and fail on the 2FA prompt.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
